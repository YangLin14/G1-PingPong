  venue_tuple_bank_receipt_path: assets/venue_tuple/v17_r12_physical_tuple_bank.receipt.json
  venue_tuple_bank_schema_version: 2
  venue_tuple_bank_min_rows_per_side: 50000
  venue_tuple_unconditional_outcomes: true
  venue_tuple_speed_limit_mps: 3.5
  # Formal 6144-env training follows HitterV11/V14: only the analytic virtual
  # ball is evaluated.  The rigid-body truth ball is opt-in from the bounded
  # low-env audit script and is never part of this task recipe.
  virtual_ball: true
  physical_ball: false
  physical_ball_impulse: false
  physical_ball_substep: 1
  base_mocap_enabled: true
  base_mocap_orientation_enabled: true
  # Fixed Build engineering assumptions, inherited from the reviewed V17-r12 full-pose path.
  # They are not presented as measured transport latency.
  base_mocap_delay_steps: 1
  base_mocap_update_interval_steps: 1
  base_mocap_position_noise_std:
  - 0.003
  - 0.003
  - 0.005
  base_mocap_orientation_noise_std_rad:
  - 0.003491
  - 0.003491
  - 0.005236
  base_mocap_extrinsic_residual_rpy_std_rad:
  - 0.005236
  - 0.005236
  - 0.008727
  base_mocap_dropout_prob: 0.01
  base_mocap_velocity_ema_alpha: 0.25
  base_mocap_max_age_s: 0.05
  base_mocap_max_propagation_s: 0.05
  # The actor always consumes the full-pose mocap schema, but all corruptions
  # start at exactly zero.  This one-way gate is strike-only: no READY/stability
  # release condition and no regression/backoff stage.
  ability_curriculum_mode: one_way_strike_gate_v1
  ability_min_exact_samples_per_side: 50.0
  ability_min_completion_per_side: 0.55
  ability_min_position_pass_per_side: 0.15
  ability_min_composite: 0.03
  ability_max_post_fall: 0.10
  ability_gate_dwell_steps: 250
  base_mocap_robustness_ramp_steps: 8000
domain_rand:
  link_mass_range:
  - 0.85
  - 1.15
  # Balance (D19): random shoves, BeyondMimic-sized at full ramp (their G1 tracking recipe:
  # x/y +-0.5 m/s, roll/pitch +-0.52 rad/s, yaw +-0.78 rad/s every 1-3 s); gentler cadence here.
  # D21: bigger and more frequent than D19 (x/y 0.5, roll/pitch 0.4, yaw 0.6, every 3-6 s)
  push_velocity_range:
    x: [-0.8, 0.8]
    y: [-0.8, 0.8]
    z: [-0.15, 0.15]
    roll: [-0.6, 0.6]
    pitch: [-0.6, 0.6]
    yaw: [-0.8, 0.8]
  push_interval_s: [2.0, 5.0]
  push_ramp_steps: 48000
  # G1: the A3 message/passive kd randomizer (pd_mode a3_message_passive_nominal_cohort_v1) encodes the
  # A3 drive split and refuses other assets; the G1 env installs the generic actuator-gain scale DR
  # (events.randomize_pd_gains = mdp.randomize_actuator_gains), driven by this +-15 % band.
  pd_gain_range:
  - 0.85
  - 1.15
# G1: derived clips (joint-space transfer of the A3 pair; see the header).
# D20: IK clips on the fist model (the joint-space clips hold the racket along the forearm).
motion_file: ../motions/preprocessed/g1ikfist_hope_forehand.npz
motion_file_2: ../motions/preprocessed/g1ikfist_hope_backhand.npz
checkpoint_export_onnx: false
# G1 v2: terminations.base_too_low.minimum_height 0.5 -> 0.40 (pelvis ratio), set in code by g1_recipe.
build_contract:
  actor_observation_dim: 104  # G1
  action_dim: 29              # G1
  forbidden_features:
  - runtime_handoff
  - qdes_projector
  - qdes_rate_limiter
  - executed_qdes_feedback
  - ready_recovery_curriculum
friction_contract:
  robot_contact_bodies:  # G1 body names
  - left_ankle_roll_link
  - right_ankle_roll_link
  ground_combine_mode: multiply
  ground_static_friction: 1.0
  ground_dynamic_friction: 1.0
  robot_static_friction_range:
  - 0.3
  - 1.6
  robot_dynamic_friction_range:
  - 0.3
  - 1.2
  restitution_range:
  - 0.0
  - 0.5
  make_consistent: true
  joint_friction: legacy_v14_unidentified
overrides:
  commands.motion.eval_clip_sequence: [0]
  commands.motion.fixed_clip_env_fraction_per_clip: 0.0
  commands.racket_target.active_clip_ids: [0]
  commands.racket_target.venue_tuple_bank_path: assets/venue_tuple/g1_fh_crosscourt_apex_bank_wide.npz
  commands.racket_target.venue_tuple_bank_receipt_path: assets/venue_tuple/g1_fh_crosscourt_apex_bank_wide.receipt.json
  commands.racket_target.venue_tuple_final_mix_prob: 1.0
  # rally pace (3000 iterations x 24 steps = 72000 env steps of ramp)
  commands.motion.rally_pace_prob: 0.6
  commands.motion.rally_pace_ramp_steps: 72000
  commands.motion.rally_pace_start_tts_range: [0.4, 0.83]
  commands.motion.rally_pace_post_strike_range: [0.7, 1.0]
  commands.racket_target.vb_timing_jitter_s: 0.03
  commands.racket_target.vb_timing_jitter_ramp_steps: 72000
  # Fist clip strike mark (2026-10-15): the fast part of the g1ikfist forehand swing is frames 41-46, so
  # the strike is marked at frame 43 (43/106) instead of 41; at 41 the reference racket moves at only
  # 1.41 m/s (old clips 2.3 m/s, bank targets ~2.5 m/s). Backhand unchanged (never sampled here).
  commands.racket_target.strike_phase: 0.40566038
  commands.racket_target.strike_phase_per_clip: [0.40566038, 0.44444444]
  # Balance first (D21). The two new terms are installed at weight 0 by the G1 env cfg
  # (config/g1/hope_env_cfg.py add_balance_terms: ceiling 0.66 m, CoM margin 0.03 m).
  rewards.root_height_ceiling.weight: -1.0
  rewards.com_support.weight: -2.0
  rewards.upright.weight: -3.0
  rewards.base_ang_vel_xy.weight: -0.15
