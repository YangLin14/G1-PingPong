# =============================================================================
# G1 FOREHAND, BALANCE FIRST (Triton Droids, docs/g1_forehand/decisions.md D21). The robot must stay
# up before anything else, so this run weights balance above the swing:
#   lower stance     the pelvis stood at ~0.72 m (MuJoCo) while the fist clip crouches at 0.675 m,
#                    because rally_ready_root_height_debt (min 0.70 m, an A3 number rescaled) taxed
#                    any lower stance. Floor -> 0.58 m and a new ceiling cost above 0.66 m
#                    (root_height_ceiling, mdp.root_height_ceiling_debt): about 6 cm lower than now.
#                    Reach checked: upper-body IK puts the fist racket on 100 % of bank strike points
#                    with the pelvis anywhere from 0.60 to 0.71 m.
#   CoM over feet    new cost when the whole-body centre of mass leaves the line between the feet by
#                    more than 3 cm (com_support, mdp.com_support_debt)
#   bigger shoves    x/y 0.5 -> 0.8 m/s, roll/pitch 0.4 -> 0.6 rad/s, yaw 0.6 -> 0.8, every 2-5 s
#                    (was 3-6), ramped in over 2000 iterations
#   stronger upright upright -1 -> -3, base_ang_vel_xy -0.05 -> -0.15, post_swing_tilt_debt -0.7 -> -1.5
# The swing rewards are unchanged. Warm start from g1_fh_fist model_32299.
#   hope_isaac_py scripts/train.py task=HOPEPingPongUnitreeG1_FH_FIST_STABLE headless=true run_name=g1_fh_stable
# =============================================================================
# G1 FOREHAND RALLY + BALANCE with the FIST GRIP (Triton Droids, docs/g1_forehand/decisions.md D20).
# A real hand closes into a fist round the handle, so the racket stands PERPENDICULAR to the forearm
# (handle across the palm, red face = palm side). Every earlier G1 run uses the A3-style mount (blade
# 21 cm along the forearm), which no hand can hold. Changes over _FH_XC_RALLY_BAL:
#   g1_racket_mount: fist   Isaac asset unitree_g1_fist (unitree/URDF/g1_29dof_pingpang_fist), racket
#                           target mount offset/quat robots/g1.py G1_FIST_MOUNT_* (train.py)
#   reference clips         g1ikfist_hope_{forehand,backhand}: the A3 clips retargeted by IK on the fist
#                           model (racket centre + face normal; strike-frame face error 8 deg)
# The bank is unchanged: an IK check puts the fist racket on 100 % of sampled bank strike targets
# (position < 3 cm, face < 15 deg) from the station with waist + arm alone.
# Warm start from the latest g1_fh_diag checkpoint (balance and footwork carry over; the arm relearns).
#   hope_isaac_py scripts/train.py task=HOPEPingPongUnitreeG1_FH_FIST headless=true run_name=g1_fh_fist
# =============================================================================
# G1 FOREHAND RALLY + BALANCE recipe: HOPEPingPongUnitreeG1_FH_XC_RALLY plus random shoves (Triton Droids,
# docs/g1_forehand/decisions.md D19). The HOPE/HITTER recipe trains with NO external
# pushes (HOPEEventCfg.push_robot = None); only mass, friction, CoM and PD-gain randomization. A real
# robot gets bumped, steps on uneven floor and is shaken by its own fast swings, and the MuJoCo push
# test (mujoco_eval_onnx.py --push) shows how quickly the current policies lose the ball / fall.
# One change, ramped in over 3000 iterations (72000 env steps, env.common_step_counter):
#   shoves   domain_rand.push_*: every 3-6 s per env a random base velocity change (x, y, z, roll,
#            pitch, yaw; mdp.push_by_setting_velocity_ramped), range growing from 0 to full
# Warm-started from the latest g1_fh_diag checkpoint (train.sbatch INIT_CHECKPOINT): in the MuJoCo push
# test it balances far better than g1_fh_rally model_5900 (falls at 0.5 m/s shoves: 6 % vs 23 %).
#   hope_isaac_py scripts/train.py task=HOPEPingPongUnitreeG1_FH_XC_RALLY_BAL headless=true run_name=g1_fh_bal
# =============================================================================
# G1 FOREHAND RALLY-PACE recipe: HOPEPingPongUnitreeG1_FH_XC plus real rally timing (Triton Droids,
# docs/g1_forehand/status/log.md). MuJoCo at real cadence showed the XC policy losing contact
# (88 % -> 38 %) and falling on 44 % of balls: it trains with 0.83 s of lead and ~3 s between strikes,
# a rally gives 0.4-0.8 s and ~1.5 s. Three changes, each ramped in over 3000 iterations:
#   rally pace     commands.motion.rally_pace_*: 60 % of swings that follow a swing enter the clip late
#                  (time-to-strike 0.4-0.83 s, no hold) and the previous follow-through is cut
#                  0.7-1.0 s after its strike (strike-to-strike ~1.1-1.8 s)
#   timing jitter  commands.racket_target.vb_timing_jitter_s: the virtual ball arrives +-30 ms off the
#                  strike clock (only the ball outcome sees it)
#   faster feeds   g1_fh_crosscourt_apex_bank_wide: feed 4.5-8.4 m/s before the bounce (was 4.4-6.6),
#                  spin up to 8 rev/s, end line -> apex 0.38-0.81 s; same zones and strike box
# Warm-started from a g1_fh_diag checkpoint (train.sbatch INIT_CHECKPOINT) so the swing is not relearned.
#   hope_isaac_py scripts/train.py task=HOPEPingPongUnitreeG1_FH_XC_RALLY headless=true run_name=g1_fh_rally
# =============================================================================
# G1 FOREHAND-ONLY rally recipe: HOPEPingPongUnitreeG1 (recipe v2, variant A clips) with every
# swing forced to the forehand clip. Both clips stay loaded because the command code indexes
# forehand = clip 0 / backhand = clip 1; only clip 0 is ever sampled:
#   * commands.motion.eval_clip_sequence = (0,)          every new swing samples clip 0
#   * commands.motion.fixed_clip_env_fraction_per_clip=0 no permanent backhand cohort (12.5 % before)
#   * commands.racket_target.active_clip_ids=(0,)  ability gate checks forehand only; both venue-tuple
#     cohorts become forehand (otherwise the never-sampled backhand locks the gate forever and the
#     tuple cohort disagrees with the clip)
# Everything else is the variant A recipe verbatim.
#   hope_isaac_py scripts/train.py task=HOPEPingPongUnitreeG1_FH headless=true run_name=g1_fh
# =============================================================================
# Unitree G1 (29-DoF) HitterPingPong task: the A3 Build recipe (HitterV11 V14 strike contract plus
# reviewed recovery/plant deltas) retargeted to the racket-equipped G1 (docs/UNITREE_G1.md).
# Differences from HOPEPingPong.yaml are marked "G1:"; everything else is the A3 recipe verbatim.
#
# G1: reference motions default to g1_hope_forehand/backhand.npz -- JOINT-SPACE TRANSFERS of the
# published A3 clips (scripts/retarget_a3_clip_to_g1.py): same joint angles by name, root rescaled to
# the G1, body poses by G1 forward kinematics. They carry the swing style only; the A3's reach and
# contact geometry are NOT preserved. Replace them with a keypoint/IK retarget when available:
#   motion_file=<g1_forehand.npz> motion_file_2=<g1_backhand.npz>
#
# G1: RECIPE V2 (2026-10). The first G1 run (job 4047) proved the A3 reach values unreachable for the
# G1 (strike matrix -9 cm x / -10 cm z, a permanent root-height debt). The values marked "G1 v2:"
# below are the A3 numbers rescaled to the G1 geometry by the rule in
# source/.../tasks/tracking/config/g1/g1_recipe.py (horizontal reach x0.79, shoulder-relative
# heights, pelvis ratio 0.76/1.068, hip-spacing ratio 0.87). train.py applies only the env/motion/
# domain_rand/rewards/overrides sections of this file; the racket: block documents the values the env
# cfg sets in code (g1_recipe.apply_recipe) and tests/test_g1_recipe_scaling.py pins both to the module.
defaults:
- /base/env_base@_here_
- /base/sim_base@_here_
- /base/randomization_base@_here_
- _self_
name: HitterPingPongUnitreeG1_FH_FIST_STABLE
g1_racket_mount: fist  # D20
robot: unitree_g1  # G1
gym_task: HOPE-HitterPingPong-UnitreeG1-v0  # G1
experiment_name: unitree_g1_hitter_pingpong  # G1: matches agents/rsl_rl_ppo_cfg.py
actor_obs_contract: hitter_pure_unitree_g1  # G1: 104-D (17 + 3*29)
# Reference motions: the derived G1 pair below, or your own G1-retargeted clips on the command line —
#   motion_file=<g1_forehand.npz> motion_file_2=<g1_backhand.npz>
env:
  # Formal Build batch. The permanent 75% core / 12.5% FH / 12.5% BH
  # cohorts therefore contain 4608 / 768 / 768 environments.
  num_envs: 6144
  episode_length_s: 10.0
motion:
  wrap_teleport: false
  stand_start_prob: 0.25
  stand_start_min_hold: 45
  stand_start_yaw_range:
  - -0.6
  - 0.6
  stand_start_yaw_ramp_steps: 96000
  hold_steps_range:
  - 45
  - 60
  hold_long_prob: 0.15
  hold_long_steps_range:
  - 150
  - 300
  post_swing_start_prob: 0.35
  clip_switch_prob: 0.0
  fixed_clip_env_fraction_per_clip: 0.125
  stand_start_x_range:
  - 0.03
  - 0.1
  # Match the actual HitterV11/V14 recovery path.  V14 inherits the 8192-entry
  # legacy ring from V13 and admits only states captured after a complete clip
  # wrap; there are no timed/risk-edge follow-through captures.
  post_swing_replay_contract: legacy_state_v1
  post_swing_buffer_size: 8192
  post_swing_min_fill: 256
  post_swing_capture_phase_bins: 1
  post_swing_capture_severity_bins: 1
  post_swing_risk_edge_capture: false
  post_swing_failure_adaptive: false
  post_swing_min_fill_per_bucket: 1
  post_swing_curriculum_scaled: false
  # Once 256 genuinely completed wraps have filled the legacy bank, the true-reset
  # mass is V14's fixed 0.35.  The independent racket ability gate below controls
  # only mocap corruption and never gates this V14 replay path.
  post_swing_ability_gate_enabled: false
  post_swing_replay_ramp_probabilities: []
  post_swing_min_hold: 45
action:
  contract: v11_affine_safe_qdes_v1
  actual_q_hard_tolerance_rad: 0.002
