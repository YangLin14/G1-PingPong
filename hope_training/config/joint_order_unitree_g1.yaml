# Unitree G1 (29-DoF, g1_29dof_rev_1_0) controllable joint order.
#
# This is the order the HOPE G1 training/export/evaluation path shares: the exported ONNX
# raw_action[29] columns, the hitter_pure_unitree_g1 observation joint slices, the reference
# runner's RobotProfile UNITREE_G1 (a3_deploy/.../reference/a3_deploy_onnx_ref_pingpong/
# joint_order_unitree_g1.py) and scripts/export_onnx.py --robot unitree_g1 all read it.
#
# Seeded with the Isaac Lab articulation enumeration of unitree/URDF/g1_29dof_pingpang/urdf/
# g1_29dof_pingpang.urdf: PhysX enumerates joints breadth-first over the kinematic tree
# (the A3 motion sidecars record the same breadth-first behaviour for the A3 URDF). It is
# therefore the familiar Isaac Lab / unitree_rl_lab G1 order, NOT the Unitree SDK / MJCF
# actuator order (left leg, right leg, waist, left arm, right arm).
#
# PIN IT: run `hope_isaac_py scripts/check_g1_asset_isaac.py` once in the Isaac environment;
# it prints env.scene["robot"].data.joint_names and fails if they differ from this list.
# The exporter hard-gates on equality, so if Isaac enumerates differently, update this file
# AND joint_order_unitree_g1.py in the reference package together (a test pins them equal).
# MuJoCo evaluation resolves joints by name, so the order only fixes the policy columns there.
# count: 29
joint_order:
  - left_hip_pitch_joint
  - right_hip_pitch_joint
  - waist_yaw_joint
  - left_hip_roll_joint
  - right_hip_roll_joint
  - waist_roll_joint
  - left_hip_yaw_joint
  - right_hip_yaw_joint
  - waist_pitch_joint
  - left_knee_joint
  - right_knee_joint
  - left_shoulder_pitch_joint
  - right_shoulder_pitch_joint
  - left_ankle_pitch_joint
  - right_ankle_pitch_joint
  - left_shoulder_roll_joint
  - right_shoulder_roll_joint
  - left_ankle_roll_joint
  - right_ankle_roll_joint
  - left_shoulder_yaw_joint
  - right_shoulder_yaw_joint
  - left_elbow_joint
  - right_elbow_joint
  - left_wrist_roll_joint
  - right_wrist_roll_joint
  - left_wrist_pitch_joint
  - right_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_wrist_yaw_joint
